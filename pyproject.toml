[project]
name = "gryphon-runtime"
version = "2.0.0"
description = "Gryphon — governed API access and bounded Python execution for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = ["mcp", "llm", "swagger", "openapi", "code-execution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp==4.0.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "orjson==3.12.0",
    "jinja2==3.1.6",
    "ruff==0.16.6",
    "structlog==26.1.0",
    "aiosqlite==0.22.1",
    "aiodocker==0.27.0",
    "anyio==4.15.0",
    "python-dotenv==1.2.3",
    "authlib==1.8.0",
    "pydantic-monty==0.0.18",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
llm = ["litellm>=1.40.0"]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff>=0.9.0",
    "mypy==1.20.2",
    "types-pyyaml==6.0.12.20260815",
    "respx==0.23.1",
    "build==1.6.0",
    "types-jsonschema>=4.26.0.20260518",
    "pre-commit>=4.6.2",
]

[project.scripts]
gryphon = "gryphon.__main__:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gryphon"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TC"]
ignore = ["A002", "A003"]

[tool.ruff.lint.isort]
known-first-party = ["gryphon"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "aiodocker",
    "aiodocker.*",
    "litellm",
    "structlog",
    "structlog.*",
    "httpx",
    "httpx.*",
    "yaml",
    "aiosqlite",
    "aiosqlite.*",
    "jinja2",
    "jinja2.*",
    "authlib",
    "authlib.*",
    "fastmcp",
    "fastmcp.*",
    "respx",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "gryphon.server"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["tests.*", "tests.*.*", "tests.unit.test_security"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=gryphon --cov-report=term-missing"

[tool.coverage.run]
source = ["src/gryphon"]
omit = ["tests/*"]
