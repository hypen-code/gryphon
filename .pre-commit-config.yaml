repos:
  # --- Ruff: lint + format --------------------------------------------------
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        language: system
        entry: uv run --frozen ruff check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run --frozen ruff format
        types_or: [python, pyi]

  # --- Mypy: strict type checking -------------------------------------------
  - repo: local
    hooks:
      - id: mypy
        name: mypy strict
        language: system
        entry: uv run --frozen --extra saas mypy
        args: [--strict, --config-file=pyproject.toml, src, tests]
        pass_filenames: false
        always_run: true

  # --- Pytest with mandatory coverage >= 90% --------------------------------
  - repo: local
    hooks:
      - id: pytest-coverage
        name: pytest (coverage >= 90%)
        language: system
        entry: uv run --frozen --extra saas pytest --cov=gryphon --cov-report=term-missing --cov-fail-under=90 -q
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ruff-tc006
        name: ruff (TC006 – quote cast() type expressions)
        language: system
        entry: uv run --frozen ruff check --select TC006 src/
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
